#:schema vendor/carthage-software/mago/schema.json

version = "1"
php-version = "8.4"

[source]
paths = ["src", "tests"]
includes = ["vendor"]
excludes = [".build/**"]

# This exact boolean type test verifies Ok/Err action return compatibility.
[linter.rules.no-boolean-flag-parameter]
exclude = ["tests/Type/ResultTypes.php"]

# These explicit else branches prove both PHPStan narrowing outcomes.
[linter.rules.no-else-clause]
exclude = ["tests/Type/ResultTypes.php"]

# The required covariance type test keeps its parent and child fixtures together.
[linter.rules.single-class-per-file]
exclude = ["tests/Type/ResultTypes.php"]

# PHPStan type-test functions follow the required camelCase naming.
[linter.rules.function-name]
camel = true

# PHPStan's assertType is an analyzer intrinsic shipped inside PHPStan's PHAR.
[analyzer]
ignore = [
    { code = "non-existent-function", in = ["tests/Type/ResultTypes.php"] },
]
